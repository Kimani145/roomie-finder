# fly.toml app configuration file generated for roomie-finder-backend on 2026-07-16T17:36:27+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'roomie-finder-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.backend'

[env]
  FRONTEND_URL = 'https://tuk-roomie-finder.vercel.app'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '8080'
  LOG_LEVEL = 'info'
  SMTP_HOST = 'smtp-relay.brevo.com'
  SMTP_PORT = '587'
  SMTP_FROM = "Roomie Finder <colonyroomiefinder@gmail.com>"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
